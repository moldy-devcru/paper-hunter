<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paper-hunter terminal</title>
    <!-- data: URI so the browser stops asking for a favicon we do not have; a 404 in
         the console is noise that hides a real error. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <!-- Vendored locally on purpose: this is a LAN tool and must work internet-down.
         See ui/static/vendor/PROVENANCE.md for version + sha256. -->
    <script src="vendor/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <nav class="tabbar" id="tabbar">
      <a href="#/terminal" data-page="terminal">Terminal</a>
      <a href="#/arms" data-page="arms">Arms</a>
      <a href="#/ledger" data-page="ledger">Ledger</a>
      <a href="#/hunt" data-page="hunt">Hunt</a>
      <a href="#/calibration" data-page="calibration">Calibration</a>
      <span class="spacer"></span>
      <span class="stamp" id="tab-stamp">read-only</span>
    </nav>

    <div id="view">
      <!-- ================= terminal ================= -->
      <section id="page-terminal" class="page">
        <header class="chrome">
          <span class="symbol" id="symbol">SPY</span>

          <div class="group" role="group" aria-label="timeframe">
            <span class="glabel">tf</span>
            <button class="tf" data-tf="5m" aria-pressed="false">5m</button>
            <button class="tf" data-tf="10m" aria-pressed="false">10m</button>
            <button class="tf" data-tf="15m" aria-pressed="true">15m</button>
            <button class="tf" data-tf="30m" aria-pressed="false">30m</button>
            <button class="tf" data-tf="1h" aria-pressed="false">1h</button>
            <button class="tf" data-tf="4h" aria-pressed="false">4h</button>
            <button class="tf" data-tf="1d" aria-pressed="false">1d</button>
            <button class="tf" data-tf="1w" aria-pressed="false">1w</button>
            <button class="tf" data-tf="1M" aria-pressed="false">1M</button>
            <button class="tf" data-tf="1Q" aria-pressed="false">1Q</button>
          </div>

          <div class="group" role="group" aria-label="indicators">
            <span class="glabel">overlays</span>
            <button class="tog" data-ind="ema50" aria-pressed="true">
              <span class="swatch" style="background:#f0b429"></span>EMA50
            </button>
            <button class="tog" data-ind="ema200" aria-pressed="true">
              <span class="swatch" style="background:#8f7bff"></span>EMA200
            </button>
            <button class="tog" data-ind="bb" aria-pressed="true">
              <span class="swatch" style="background:#3fb9c8"></span>BB(20,2)
            </button>
            <button class="tog" data-ind="rsi" aria-pressed="true">
              <span class="swatch" style="background:#e0a63a"></span>RSI(14)
            </button>
            <button class="tog" data-ind="macd" aria-pressed="true">
              <span class="swatch" style="background:#4c9aff"></span>MACD(12,26,9)
            </button>
            <button class="tog" data-ind="volume" aria-pressed="true">
              <span class="swatch" style="background:#26a69a"></span>VOL
            </button>
          </div>

          <div class="group">
            <span class="prov" id="prov" title="feed provenance of the bars on screen">
              provenance: —
            </span>
          </div>

          <div class="group">
            <span class="health" title="server health">
              <span class="dot" id="health-dot"></span>
              <span id="health-text">health —</span>
            </span>
            <span class="stamp" id="updated">never loaded</span>
          </div>
        </header>

        <div class="readout" id="readout">
          <span>hover a candle for OHLCV</span>
        </div>

        <div class="chart-wrap">
          <div id="chart"></div>
          <div class="overlay" id="overlay">
            <div>
              <div class="big" id="overlay-title">no data</div>
              <div class="small" id="overlay-detail"></div>
            </div>
          </div>
        </div>

        <footer class="ro">
          read-only by construction — every database is opened mode=ro and the app has
          zero non-GET routes. The window is a window, not a door.
        </footer>
      </section>

      <!-- ================= U3 / U4 placeholders ================= -->
      <section id="page-placeholder" class="page" hidden>
        <div class="placeholder">
          <h2 id="ph-title">page</h2>
          <span class="phase" id="ph-phase">pending</span>
          <p id="ph-body">not built yet.</p>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
