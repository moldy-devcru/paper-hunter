[project]
name = "paper-hunter"
version = "0.1.0"
description = "Pre-registered SPY paper-trading experiment (Operation Hunting Blind)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # TestClient transport for the ui package's offline API tests.
    "httpx>=0.27",
]
# The UI server is an optional extra on purpose: the executor is stdlib-only and
# keeps working with no third-party packages at all. Installing the terminal adds
# fastapi/uvicorn and nothing else, and neither is imported outside `ui/`.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data", "executor", "journal", "analysis", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
