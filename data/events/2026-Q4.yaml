# Refresh procedure and free sources: data/events/README.md.
#
# verified: false = transcribed from a secondary source or a rule of thumb, NOT
# confirmed against the issuing authority. Reconcile before the window opens;
# EventCalendar.unverified() lists them so nothing hides.

