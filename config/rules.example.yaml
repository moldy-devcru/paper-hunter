# paper-hunter — frozen rulebook (Phase 1b)
#
# This file IS the experiment's rulebook. docs/brief.md is prose; this is what the
# deterministic executor evaluates. Every threshold below is transcribed from the
# brief — nothing invented. Where the brief left a value open ("N to be calibrated"),
# it is present but explicitly marked `calibration_pending: true` with a null value,
# because a silent default is a fabricated threshold and would poison the experiment.
#
# Rules are FROZEN before the first trade. Any change = new strategy version
# (bump `strategy.version`), journaled at the seam. Never mid-position.
#
# Loading: config.loader.load_rules() validates strictly — unknown keys are rejected,
# because a typo in a frozen rulebook must fail loudly, not quietly disable a veto.

strategy:
  # 1.1.0-draft (2026-10-03): rulings R3/R4/R5 encoded. 1.2.0-draft (2026-10-03):
  # arm C's entry window DECLARED (09:45-15:30 ET) — a rulebook change, not a code
  # one, so it carries a version. Draft status is unchanged on purpose: the operator
  # freezes 1.x.0 at ratification, after T6's calibration lands.
  #
  # 1.3.0-draft (2026-10-03): the T4 intraday run-rate branch is IMPLEMENTED. No
  # threshold moved — `intraday_run_rate_min: 1.5` was already frozen in this file and
  # no code read it (outsider review 4.3). This bump exists so the paper trail names
  # *when effective gate behaviour changed*, not because the rulebook's meaning changed:
  # the rule text already froze the OR branch and the code now runs it. It is
  # "pre-registration hygiene done before the window opened", recorded in writing at
  # docs/ratification.md (e).
  #
  # Also carried at this seam, per the same 2026-10-03 debate: the T5 tenor-key
  # strike-axis finding was a CANDIDATE for the next ruling cycle, NOT a change made
  # here. `STRIKE_BUCKET_SIZE` is unchanged in this version. See (e) queued items.
  #
  # 1.4.0-draft (2026-10-03): the T5 tenor key's STRIKE axis switches from absolute
  # $5 buckets to MONEYNESS-relative buckets at 2% (`MONEYNESS_BUCKET_PCT`). RULED by
  # the operator the same day, on the measurement in
  # docs/reviews/2026-10-03-iv-backfill-feasibility.md: inside the frozen 1y lookback
  # the $5 axis collects at most 22 observations in any key (25 across all available
  # history), against `MIN_OBSERVATIONS = 60`, so the series could never warm at any
  # depth. 2% moneyness collects 210 in the same window.
  #
  # This IS a change to what T5 measures, and it is versioned for that reason. No
  # threshold moved: `MIN_OBSERVATIONS` stays 60, `iv_rank_lookback` stays "1y",
  # `iv_rank_max` stays 50, and the DTE axis is untouched (R4). The keys are also
  # NAMESPACED (`mte...mny...` vs the old `dte...<dollars>`), so rows written under the
  # old axis can never be counted toward the new one — the R7 disposition, by
  # construction. Warm-up restarts from zero a second time; that cost is stated in
  # docs/ratification.md, not buried here.
  version: "1.4.0-draft"         # bump on every rule change (brief: "any change = new strategy version")
  status: "DRAFT"                 # flipped to "FROZEN" by the operator at ratification
  symbol: SPY
  timezone: America/New_York
  brief: docs/brief.md

# ---------------------------------------------------------------------------
# window — how long the experiment runs (brief: "Open decisions for the operator")
#
# RULED 2026-10-02 (operator): 3 months, ~60 sessions. The session count is the
# calendar's own arithmetic (3 months of sessions), not a second decision: arm B
# needs the sample. The window may only be EXTENDED at the monthly review —
# extending it after seeing results is the failure mode this whole document exists
# to prevent, so `extension` is not a free-form knob.
#
# `start` is stamped when the window actually opens and is mirrored into the
# journal's `meta.window_start`, which is what the scorecard reads. It stays null
# in this file until then: a rulebook that claims a start date it has not reached
# is a claim, not a record.
# ---------------------------------------------------------------------------
window:
  months: 3
  target_sessions: 60
  extension: monthly_review_only
  start: 2026-11-02
  # RULED 2026-10-03 (operator): the November window opens ARMS A + C ONLY. Arm B is
  # inert until T5 can resolve, because the deployed IV store has one observation per
  # tenor and `IvRankStore.MIN_OBSERVATIONS = 60` — T5 is PENDING, and T5 is blocking
  # for arm B, so arm B could not take a single position in the window no matter how
  # good the rest of the stack looked. Naming the arms here makes "B is inert" a fact
  # of the pre-registration rather than a surprise found in a journal.
  #
  # `arm_b` is gated, not disabled: when T5's IV rank resolves the gate opens and arm
  # B plans and trades under its existing rules with no further ruling. Arm B's rules
  # are frozen and unchanged; only its activation is gated.
  arms: [A, C]
  arm_b_gate:
    requires: t5_iv_rank_defined
    status: armed_pending_warmup
    note: "opens automatically when a tenor the plan reads reaches MIN_OBSERVATIONS; no new ruling needed"

# ---------------------------------------------------------------------------
# arms — 3 x $10k paper, same window (brief: "Arms")
# ---------------------------------------------------------------------------
arms:
  A:
    name: control
    description: SPY buy-and-hold. Dumb money by design — the bar arms B and C must clear.
    bankroll_usd: 10000
    trading_days: 1
    entry:
      when: first_market_open_of_window   # "$10k at market open of day 1"
      instrument: equity
      symbol: SPY
    managed: false                # no decisions, no trades — it is the benchmark, not a strategy
    rules: []

  B:
    name: gambler
    description: TA-gated 0DTE OTM contracts on SPY. Exits same day, always. Never holds to expiry.
    bankroll_usd: 10000
    checklist: [T1, T2, T2b, T3, T4, T5, T6]
    entry:
      window_et:
        start: "09:45"           # "no opening-drive noise trades"
        end: "14:00"             # "no late hero entries"
      instrument: option
      right: call_or_put_per_direction
      dte: 0
      moneyness: OTM
      strike_rule: first_otm_strike_beyond_setup_day_range_projection
      premium_pct_of_bankroll_max: 0.02   # "premium <= 2% of arm bankroll"
      premium_usd_hard_cap: 200          # "$200/trade at $10k"; at cap => 50 total losses and the arm is dead
    exits:
      time_stop:
        after_entry_minutes: 120         # "if position not >= +30% by 2 hours after entry"
        if_under_gain_pct: 0.30
        action: close_at_market
      profit_take:
        close_pct_at_100pct_gain: 0.50   # "close 50% at +100%"
        trail_remainder: true
      hard_close_et: "15:30"              # "close ALL by 15:30 ET. No exceptions, no expiry."
      hold_to_expiry: false
    limits:
      max_concurrent_positions: 1
      max_entries_per_week: 3             # anti-tilt governor
    rules:
      - "Arm B is structurally negative-EV as an asset class; the test is whether selective
         high-conviction timing overcomes the decay (brief prediction 2). Weeks with zero
         trades is the system working."

  C:
    name: stalker
    description: TA-gated long-dated deep-ITM calls. Leverage substitute with mechanical rolls.
    bankroll_usd: 10000
    checklist: [T1, T2, T2b, T3, T4, T5]
    entry:
      # RULED 2026-10-03 (operator): arm C's entry window, DECLARED. Until this ruling
      # arm C declared none, so R2's "a green plan arms the loop on the entry window
      # alone" had no boundary to be alone *to* for this arm and the code fell back to
      # the whole session (09:30-16:00) — a placeholder, not a policy. The window bounds
      # NEW ENTRIES only; it does not bound R1's roll, which stays available any time
      # the loop runs, because a position already past its roll trigger must not wait
      # for the window to reopen.
      window_et:
        start: "09:45"           # same open as arm B: no opening-drive entries
        end: "15:30"             # 30 minutes before the close, matching arm B's hard close
      instrument: option
      right: call                           # the brief specifies calls for arm C
      dte:
        min: 90
        max: 180
      delta_min: 0.80
      premium_pct_of_bankroll_max: 0.50    # cash buffer for rolls
    exits:
      roll:
        trigger:
          delta_below: 0.70
          dte_below: 45
          rule: whichever_first
        to: next_expiry_meeting_entry_criteria
        discretionary: false                # "roll is mechanical, not discretionary"
      exit_all:
        trigger: t1_break
        condition: close_below_50ema_for_3_consecutive_eods
        action: liquidate_to_cash
        then: wait_for_full_checklist_resatisfaction
    limits:
      max_concurrent_positions: 1
    rules:
      - "Arm C tracks arm A with leverage-amplified variance (brief prediction 3)."

# ---------------------------------------------------------------------------
# checklist — confluence, not any-one. ALL listed conditions must be true.
# ---------------------------------------------------------------------------
checklist:
  t1_ema_alignment:
    id: T1
    applies_to: [B, C]
    ema_fast: 50
    ema_slow: 200
    call_bias: close_above_ema_fast_and_ema_fast_above_ema_slow
    put_bias: inverted
    counter_trend:
      allowed: false                        # "default is WITH trend only"
      requires_all_of: [T2, T2b, T3, T4, T5]
      requires_documented_reversal_trigger: true

  t2_rsi:
    id: T2
    applies_to: [B, C]
    period: 14
    call_bias_min: 50                       # "RSI(14) > 50 for call bias"
    put_bias_max: 50                        # "RSI(14) < 50 for put bias"
    exhaustion:
      high: 75                              # "> 75 = no new entries, wait for reset"
      low: 25                               # "< 25 = no new entries, wait for reset"
      action: block_new_entries

  t2b_macd:
    id: T2b
    applies_to: [B, C]
    fast: 12
    slow: 26
    signal: 9
    line_vs_signal: above_for_call_bias_below_for_put_bias
    histogram:
      expanding_in_trade_direction: preferred   # soft preference, not a gate
      contracting: veto                         # "momentum fading, log as veto reason"
    fresh_cross_guard:
      max_age_hours: 24                           # "no entries against a fresh MACD cross < 1 day old"
      exception_if: t3_squeeze_release_fires       # whipsaw guard

  t3_bollinger:
    id: T3
    applies_to: [B, C]
    satisfied_if_any_of:
      squeeze_release:
        bandwidth_below_percentile: 20            # "bandwidth < 20th percentile of 60d"
        lookback_days: 60
        then: expanding_in_trade_direction
      band_rejection:
        calls: close_tags_lower_band_and_closes_back_inside
        puts: inverted

  t4_volume:
    id: T4
    applies_to: [B, C]
    relative_volume_min: 1.5                # "relative volume >= 1.5x 20-day average"
    lookback_days: 20
    intraday_run_rate_min: 1.5             # "or intraday run-rate >= 1.5x for intraday triggers"

  t5_options_chain:
    id: T5
    applies_to: [B, C]
    purpose: no_hostile_iv_setup
    # RULED 2026-10-03 (operator, ruling R4): T5 reads the ROLLING DTE-keyed tenor
    # (`dte_tenor_key`), not the expiry-keyed one. The expiry-keyed series includes the
    # calendar expiry in its key, so a weekly expiry accrues ~5 observations and dies
    # with that expiry — it can never reach MIN_OBSERVATIONS=60 and T5 would stay
    # PENDING forever. The rolling key buckets DTE (see `dte_bucket_days`) and rolls
    # with the underlying instead.
    #
    # The cost is stated, not hidden: a DTE bucket mixes expiries, so the rank is a
    # statement about "roughly this many DTE out, ATM-ish" rather than about one exact
    # contract. The expiry-keyed series is still written by the soak, so the
    # approximation can be measured against the exact thing instead of trusted.
    #
    # Operator's reasoning on the record: roll-before-theta instinct. That instinct is
    # ALREADY the frozen arm C roll trigger (delta < 0.70 or DTE < 45); IV rank gates
    # ENTRY, not roll timing, so the two do not fight.
    tenor_key_mode: rolling_dte
    # RULED 2026-10-03 (operator, key schema): the strike axis of this rolling key is
    # MONEYNESS-relative — `strike/spot - 1`, bucketed at 2 percentage points
    # (`MONEYNESS_BUCKET_PCT` in `executor/iv_rank.py`, the single constant the soak
    # writes and the plan reads). The absolute `$5` axis it replaced rotated with spot,
    # so an ATM contract's key changed every few percent and no key ever reached 60
    # observations. Keys are namespaced `mte<dte>-<side>-mny<bucket>`; rows written
    # under the old dollar axis are orphaned, not migrated (the R7 disposition).
    #
    # Days per rolling-DTE bucket. One week, because every option expiry steps down
    # the DTE axis by exactly 7 between two Fridays — with a 7-day bucket the SET of
    # buckets written each session is stable, so each keeps collecting one observation
    # per session from a different expiry each time.
    dte_bucket_days: 7
    arm_b:
      iv_rank_max: 50                      # premium-buying (B): IV rank < 50
      iv_rank_lookback: "1y"
    arm_c:
      requirement: iv_on_chosen_strike_within_normal_band
      # RULED 2026-10-02 (operator, delegated to lead's recommendation): arm C buys
      # premium with long-dated deep-ITM calls, so it gets the SAME rank ceiling as
      # arm B — < 50. The brief only said "within normal band"; the number is the
      # operator's call now, recorded here so a later reader can see it was chosen
      # and not inherited.
      iv_rank_max: 50
      calibration_pending: false
    event_calendar:
      checked: daily
      hard_veto: true
      calendar_dir: data/events
      veto_kinds: [fomc, cpi]              # RULED 2026-10-02: earnings removed (see earnings_veto)
      earnings_veto:
        # RULED 2026-10-02 (operator): the earnings veto is DROPPED for SPY —
        # "ignore any particular ticker's earnings for SPY". A single component's
        # print does not move index IV regime, so vetoing the index because one
        # name reported would be vetoing on noise. FOMC and CPI remain hard vetoes;
        # OPEX remains listed and explicitly non-veto.
        #
        # This is recorded as DISABLED BY RULING rather than deleted: the brief did
        # ask for it, so its absence needs a reason on the page. The loader pins
        # every field below to its disabled value — re-enabling it is a code +
        # rulebook change (new strategy version), which is what "explicitly
        # disabled" is supposed to cost.
        enabled: false
        required: false
        implemented: false
        calibration_pending: false
        disabled_by: operator_ruling_2026-10-02
        reason: component earnings do not move index IV regime for SPY
    notes:
      - "IV rank needs ~1y of history for the chosen strike — open data question in the brief."

  t6_flow:
    id: T6
    applies_to: [B]                        # "Arm B only, flow gate"
    source: deep_otm_0dte_volume
    side: trade_direction
    baseline_lookback_days: 20
    multiplier:
      value: null                      # "N to be calibrated from historical SPY flow data during implementation"
      calibration_pending: true             # ...and frozen at the first monthly review (operator ruling 2026-10-02)
      reason: N = P90 of the soak's 20-session ratio distribution, frozen at the first monthly review with the numbers shown (operator ruling 2026-10-02, delegated to the algo)
    # What "deep OTM" means numerically. The brief does not define it; the research
    # note illustrates it (">=3% OTM", 2026-10-02-flow-data-market.md §5.3). Separate
    # thresholds per side.
    #
    # RULED 2026-10-02 (operator, delegated to the algo): BOTH this threshold and the
    # N multiplier below are CALIBRATED BY THE ALGO from the soak's 20-session
    # distribution and frozen at the first monthly review, with the numbers shown.
    # Until that review they stay exactly here — null, calibration_pending, visibly
    # unfrozen. The working 3% the soak runs at is the *input to* the calibration,
    # not the frozen value: an "e.g." in a research note is an illustration, and a
    # silent 3% default would be an invented threshold.
    deep_otm:
      measure: pct_distance_from_spot
      calls:
        value: null
        calibration_pending: true
        reason: working 3% from research note §5.3; operator ruled 2026-10-02 that the algo calibrates it from the 20-session distribution and freezes it at the first monthly review
      puts:
        value: null
        calibration_pending: true
        reason: working 3% from research note §5.3; operator ruled 2026-10-02 that the algo calibrates it from the 20-session distribution and freezes it at the first monthly review
      bucket_size_pct: 1.0                 # histogram bucket width; integer thresholds re-derive exactly
      applies_to_expiry: zero_dte
      volume_source: daily_bar_volume      # the snapshot's dailyBar.v, not quote size
    evaluation: EOD_only                    # the flow DATA is EOD-only; the POLICY below is not
    # RULED 2026-10-03 00:43 EDT (operator, ruling R3) — OPERATOR-RATIFIED, not
    # delegated: mads confirmed "your recs are good with me". T6's gate data is
    # EOD-confirmed, but the thing it gates — an arm B entry — is intraday. Resolved as
    # CARRY-FORWARD: the newest confirmed row from a session BEFORE this one is this
    # session's gate input.
    #
    # The alternative reading was `next_day_only`: the gate resolves only from the
    # immediately preceding session, and a gap (holiday, failed soak) leaves T6
    # PENDING rather than carrying an older regime forward. It is kept as a live switch
    # so the choice can be changed without a code edit; flipping the default is a
    # one-line YAML change plus a strategy-version bump.
    #
    # CAVEAT, on the record, because it is the cost of the ruling and not a detail: the
    # carried ratio is one session stale, so T6 is a *prior-session regime* filter, not
    # a same-session flow read. Nothing about the carried row describes today's flow.
    # `executor/flow_gate.py` records `sessions_stale` on every read, so the staleness
    # is measured in the journal rather than asserted here.
    #
    # REVISIT: at the first monthly review, once the baseline has enough sessions to
    # say whether the carry-forward is behaving — i.e. whether the call side's P90
    # (1.157) and the put side's (4.024) describe a distribution stable enough for one
    # multiplier applied to whichever side is traded.
    intraday_policy: carry_forward
    intraday_policy_operator_ruling: "2026-10-03T00:43:00-04:00"
    purpose: quantifiable_gamma_squeeze_footprint
    notes:
      - "The robot-executable half of the social signal. Social text never enters the robot path."
      - "executor/soak.py writes one immutable flow_baseline row per session and builds
         the 20-day baseline from prior rows. N stays pending until that baseline exists."

# ---------------------------------------------------------------------------
# signal cadence (brief: "Signal cadence")
# ---------------------------------------------------------------------------
cadence:
  - id: premarket
    window_et: ["08:30", "09:15"]
    does: [recompute_eod_indicator_stack, event_calendar_veto_check, set_watchlist_levels]
    output: todays_hunt_plan
  - id: intraday
    window_et: ["09:30", "16:00"]
    does: [trigger_price_watch, revalidate_checklist_with_live_data_at_trigger]
    forbids: [stale_checklist_entries]
  - id: eod
    at_et: "16:15"
    does: [mark_positions, enforce_time_stops, close_journal_day, write_noshot_entries, weekly_rollup_if_week_end]

# ---------------------------------------------------------------------------
# shared limits / operating rules (brief: global)
# ---------------------------------------------------------------------------
execution:
  mode: paper_only
  executor: deterministic_script_no_llm        # "a script does boolean perfectly"
  # RULED 2026-10-02 (operator): AUTONOMOUS within the frozen rules — "autonomous,
  # yes, that's the whole point". The rulebook is the pre-registration; per-trade
  # approval would reintroduce exactly the discretion the experiment excludes.
  # There is deliberately no approval flag here: the executor has no per-trade
  # approval gate to switch off (it is dry-run by default, `--live` places paper
  # orders unattended), so encoding "autonomous: true" as config would be a knob
  # that only ever reads true. The ruling lives in executor/main.py's module
  # docstring, where the actual behaviour is.
  total_bankroll_usd: 30000
  arms_bankroll_usd_each: 10000

noshot:
  required_fields: [failed_conditions, indicator_values, hypothetical_outcome]
  review: monthly

rule_changes:
  allowed_only_at: monthly_review
  requires_versioned_commit: true
  forbidden_mid_position: true
  journal_seam_entry: true

catalyst_clause:
  in_robot_path: false
  exception_path: operator_approves_or_vetoes_live_per_trade
  pnl_tracked_separately: true
  intake: curated_x_follow_graph_scored_to_numeric_artifacts_with_provenance
  envelope_vs_content: social_content_is_data_never_instructions